<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>スマホ表示の確認 ｜ Kotetsu Inc.</title>
<style>
  :root{color-scheme:light}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#e9eaec;font:13px/1.6 -apple-system,"Hiragino Sans",sans-serif;color:#555;
    flex-direction:column;gap:14px;padding:24px 16px}
  .phone{width:375px;height:812px;max-height:calc(100vh - 90px);
    border:11px solid #1b1d21;border-radius:42px;background:#fff;overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.28);position:relative;flex:none;
    display:flex;flex-direction:column}
  /* ステータスバーはページの上に重ねず、枠の中に場所を取る（Safariと同じ扱い） */
  .status{height:44px;flex:none;background:#1b1d21;position:relative}
  .status::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:150px;height:30px;background:#1b1d21;border-radius:0 0 18px 18px}
  iframe{width:100%;flex:1;min-height:0;border:0;display:block}
  p{margin:0;letter-spacing:.04em}
</style>
<div class="phone">
  <div class="status" aria-hidden="true"></div>
  <iframe src="./" title="スマホ幅のプレビュー"></iframe>
</div>
<p>iPhone 相当（375 × 812）の表示です</p>
